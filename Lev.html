<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 - Lev's Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 10px -7px rgba(0, 0, 0, 0.05)',
                        'hover': '0 20px 35px -10px rgba(0, 0, 0, 0.1), 0 10px 15px -5px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f6f8fc 0%, #eef2f7 100%);
            min-height: 100vh;
        }

        /* Styling package colors with high legibility */
        .pkg-1 { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .pkg-2 { background-color: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
        .pkg-3 { background-color: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }
        .pkg-4 { background-color: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
        .pkg-5 { background-color: #f3e8ff; color: #6b21a8; border: 1px solid #e9d5ff; }
        .pkg-6 { background-color: #fce7f3; color: #9d174d; border: 1px solid #fbcfe8; }
        .pkg-7 { background-color: #ffedd5; color: #c2410c; border: 1px solid #fdba74; }
        .pkg-8 { background-color: #ccfbf1; color: #115e59; border: 1px solid #99f6e4; }
        .pkg-9 { background-color: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }

        /* Lesson ring highlighting */
        .has-lesson {
            box-shadow: inset 0 0 0 2px #2563eb, 0 2px 4px rgba(37, 99, 235, 0.2);
            font-weight: 700 !important;
            position: relative;
        }

        .has-lesson::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 6px;
            height: 6px;
            background-color: #2563eb;
            border-radius: 50%;
        }

        .weekend-day {
            background-color: #fff5f5;
            color: #e11d48;
        }
    </style>
</head>
<body class="text-slate-800 antialiased py-8 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="text-center py-6 bg-white/70 backdrop-blur-md rounded-2xl border border-white/80 shadow-soft">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-slate-900 tracking-tight">2026</h1>
            <div class="text-lg sm:text-xl font-bold text-blue-600 tracking-widest uppercase mt-1">Lev's Calendar</div>
        </header>

        <!-- Dynamic Info Bar on Day Hover/Selection -->
        <div id="info-bar" class="hidden transition-all duration-300 bg-blue-900 text-white px-5 py-3 rounded-xl shadow-lg flex items-center justify-between text-sm sm:text-base font-medium">
            <span id="info-date" class="font-semibold text-blue-200"></span>
            <span id="info-status" class="bg-blue-800 px-3 py-1 rounded-lg"></span>
        </div>

        <!-- Main Calendar Grid -->
        <main>
            <div id="calendar-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

            <div class="mt-10 bg-white/80 backdrop-blur-md rounded-2xl p-6 border border-white shadow-soft text-center">
                <h2 class="text-base sm:text-lg font-bold text-slate-900 mb-4 inline-flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Обозначения
                </h2>
                
                <div class="flex flex-wrap items-center justify-center gap-4 sm:gap-6 text-xs sm:text-sm">
                    <div class="flex items-center gap-2.5 p-2 px-4 rounded-xl bg-slate-50 border border-slate-100">
                        <div class="w-6 h-6 rounded-lg weekend-day flex items-center justify-center font-bold text-xs">Сб</div>
                        <span class="font-medium text-slate-600">Выходные дни</span>
                    </div>
                    <div class="flex items-center gap-2.5 p-2 px-4 rounded-xl bg-slate-50 border border-slate-100">
                        <div class="w-6 h-6 rounded-lg bg-white has-lesson flex items-center justify-center font-bold text-xs text-blue-600">12</div>
                        <span class="font-medium text-slate-600">Занятие Льва (Пн / Чт)</span>
                    </div>
                </div>
            </div>
        </main>

        <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200/60">
            © 2026 Lev's Schedule Calendar
        </footer>
    </div>

    <script>
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const dayNames = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
        const year = 2026;

        // Package Data Definitions (20 working days each)
        const pkg1 = [
            "2026-01-22","2026-01-23","2026-01-26","2026-01-27","2026-01-28","2026-01-29","2026-01-30",
            "2026-02-02","2026-02-03","2026-02-04","2026-02-05","2026-02-06",
            "2026-02-09","2026-02-10","2026-02-11","2026-02-12","2026-02-13",
            "2026-02-16","2026-02-17","2026-02-18"
        ];

        const pkg2 = [
            "2026-02-19","2026-02-20",
            "2026-02-23","2026-02-24","2026-02-25","2026-02-26","2026-02-27",
            "2026-03-02","2026-03-03","2026-03-04","2026-03-05","2026-03-06",
            "2026-03-09","2026-03-10","2026-03-11","2026-03-12","2026-03-13",
            "2026-03-16","2026-03-17","2026-03-18"
        ];

        const pkg3 = [
            "2026-03-19","2026-03-20",
            "2026-03-23","2026-03-24","2026-03-25","2026-03-26","2026-03-27",
            "2026-03-30","2026-03-31","2026-04-01","2026-04-02","2026-04-03",
            "2026-04-06","2026-04-07","2026-04-08","2026-04-09","2026-04-10",
            "2026-04-13","2026-04-14","2026-04-15"
        ];

        const pkg4 = [
            "2026-04-16","2026-04-17",
            "2026-04-20","2026-04-21","2026-04-22","2026-04-23","2026-04-24",
            "2026-04-27","2026-04-28","2026-04-29","2026-04-30",
            "2026-05-04","2026-05-05","2026-05-06","2026-05-07",
            "2026-05-25","2026-05-26","2026-05-27","2026-05-28","2026-05-29"
        ];

        const pkg5 = [
            "2026-06-01","2026-06-02","2026-06-03","2026-06-04","2026-06-05",
            "2026-06-08","2026-06-09","2026-06-10","2026-06-11","2026-06-12",
            "2026-06-15","2026-06-16","2026-06-17","2026-06-18","2026-06-19",
            "2026-06-22","2026-06-23","2026-06-24","2026-06-25","2026-06-26"
        ];

        const pkg6 = [
            "2026-06-29","2026-06-30","2026-07-01","2026-07-02","2026-07-03",
            "2026-07-06","2026-07-07","2026-07-08","2026-07-09","2026-07-10",
            "2026-07-13","2026-07-14","2026-07-15","2026-07-16","2026-07-17",
            "2026-07-20","2026-07-21","2026-07-22","2026-07-23","2026-07-24"
        ];

        const pkg7 = [
            "2026-07-27","2026-07-28","2026-07-29","2026-07-30","2026-07-31",
            "2026-08-03","2026-08-04","2026-08-05","2026-08-06","2026-08-07",
            "2026-08-10","2026-08-11","2026-08-12","2026-08-13","2026-08-14",
            "2026-08-17","2026-08-18","2026-08-19","2026-08-20","2026-08-21"
        ];

        const pkg8 = [
            "2026-08-24","2026-08-25","2026-08-26","2026-08-27","2026-08-28",
            "2026-08-31","2026-09-01","2026-09-02","2026-09-03","2026-09-04",
            "2026-09-07","2026-09-08","2026-09-09","2026-09-10","2026-09-11",
            "2026-09-14","2026-09-15","2026-09-16","2026-09-17","2026-09-18"
        ];

        const pkg9 = [
            "2026-09-21","2026-09-22","2026-09-23","2026-09-24","2026-09-25",
            "2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02",
            "2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09",
            "2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16"
        ];

        // Lev's Lessons Schedule (Mondays + Thursdays)
        const lessons = [
            "2026-01-22","2026-01-26","2026-01-29","2026-02-02",
            "2026-02-05","2026-02-09","2026-02-12","2026-02-16",
            "2026-02-19","2026-02-23","2026-02-26","2026-03-02",
            "2026-03-05","2026-03-09","2026-03-12","2026-03-16",
            "2026-03-19","2026-03-23","2026-03-26","2026-03-30",
            "2026-04-02","2026-04-06","2026-04-09","2026-04-13",
            "2026-04-16","2026-04-20","2026-04-23","2026-04-27",
            "2026-04-30","2026-05-04","2026-05-25","2026-05-28",
            "2026-06-01","2026-06-04","2026-06-08","2026-06-11",
            "2026-06-15","2026-06-18","2026-06-22","2026-06-25",
            "2026-06-29","2026-07-02","2026-07-06","2026-07-09",
            "2026-07-13","2026-07-16","2026-07-20","2026-07-23",
            "2026-07-27","2026-07-30","2026-08-03","2026-08-06",
            "2026-08-10","2026-08-13","2026-08-17","2026-08-20",
            "2026-08-24","2026-08-27","2026-08-31","2026-09-03",
            "2026-09-07","2026-09-10","2026-09-14","2026-09-17",
            "2026-09-21","2026-09-24","2026-09-28","2026-10-01",
            "2026-10-05","2026-10-08","2026-10-12","2026-10-15"
        ];

        function getDaysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }
        function getFirstDayOfMonth(y, m) { const d = new Date(y, m, 1).getDay(); return d === 0 ? 6 : d - 1; }
        function formatDate(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }

        function getPackageNumber(dateStr) {
            if (pkg1.includes(dateStr)) return 1;
            if (pkg2.includes(dateStr)) return 2;
            if (pkg3.includes(dateStr)) return 3;
            if (pkg4.includes(dateStr)) return 4;
            if (pkg5.includes(dateStr)) return 5;
            if (pkg6.includes(dateStr)) return 6;
            if (pkg7.includes(dateStr)) return 7;
            if (pkg8.includes(dateStr)) return 8;
            if (pkg9.includes(dateStr)) return 9;
            return null;
        }

        function isLesson(dateStr) { return lessons.includes(dateStr); }

        function createMonthCard(y, m) {
            const dim = getDaysInMonth(y, m);
            const off = getFirstDayOfMonth(y, m);
            const total = Math.ceil((off + dim) / 7) * 7;

            let html = `
            <div class="bg-white/80 backdrop-blur-md rounded-2xl p-5 border border-white/90 shadow-soft hover:shadow-hover transition-all duration-300">
                <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-100">
                    <h3 class="text-lg font-bold text-slate-800">${monthNames[m]}</h3>
                    <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-500 rounded-full">${y}</span>
                </div>
                <div class="grid grid-cols-7 gap-1 text-center mb-2">
            `;

            // Day headers
            dayNames.forEach((wd, idx) => {
                const isWk = idx >= 5;
                html += `<div class="text-xs font-bold ${isWk ? 'text-rose-500' : 'text-slate-400'} py-1">${wd}</div>`;
            });

            html += `</div><div class="grid grid-cols-7 gap-1 text-center">`;

            let day = 1;
            for (let i = 0; i < total; i++) {
                if (i >= off && day <= dim) {
                    const dateStr = formatDate(y, m, day);
                    const pkgNum = getPackageNumber(dateStr);
                    const hasLes = isLesson(dateStr);
                    const dateObj = new Date(y, m, day);
                    const isWk = dateObj.getDay() === 0 || dateObj.getDay() === 6;

                    let classes = "h-9 rounded-xl flex items-center justify-center text-xs font-medium transition-all duration-200 cursor-pointer ";
                    
                    if (pkgNum) {
                        classes += `pkg-${pkgNum} `;
                    } else if (isWk) {
                        classes += "weekend-day ";
                    } else {
                        classes += "text-slate-700 hover:bg-slate-100 ";
                    }

                    if (hasLes) {
                        classes += "has-lesson ";
                    }

                    let statusText = [];
                    if (pkgNum) statusText.push(`Пакет ${pkgNum}`);
                    if (hasLes) statusText.push("Занятие Льва");
                    if (isWk && !pkgNum) statusText.push("Выходной");
                    if (statusText.length === 0) statusText.push("Рабочий день");

                    const fullStatus = statusText.join(" + ");
                    const readableDate = `${day} ${monthNames[m]} ${y}`;

                    html += `
                        <div class="${classes}" 
                             onmouseenter="showInfo('${readableDate}', '${fullStatus}')"
                             onmouseleave="hideInfo()">
                            ${day}
                        </div>
                    `;
                    day++;
                } else {
                    html += `<div class="h-9"></div>`;
                }
            }

            html += `</div></div>`;
            return html;
        }

        function showInfo(date, status) {
            const bar = document.getElementById("info-bar");
            document.getElementById("info-date").textContent = date;
            document.getElementById("info-status").textContent = status;
            bar.classList.remove("hidden");
        }

        function hideInfo() {
            const bar = document.getElementById("info-bar");
            bar.classList.add("hidden");
        }

        function render() {
            const container = document.getElementById("calendar-container");
            container.innerHTML = "";
            for (let m = 0; m < 12; m++) {
                container.innerHTML += createMonthCard(year, m);
            }
        }

        render();
    </script>
</body>
</html>

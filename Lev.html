<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 - Lev's Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: #0f172a;
            min-height: 100vh;
        }

        .pkg-1 { background-color: rgba(144, 238, 144, 0.35); }
        .pkg-2 { background-color: rgba(173, 216, 230, 0.4); }
        .pkg-3 { background-color: rgba(255, 218, 185, 0.5); }
        .pkg-4 { background-color: rgba(255, 255, 153, 0.45); }
        .pkg-5 { background-color: rgba(216, 191, 216, 0.45); }
        .pkg-6 { background-color: rgba(255, 182, 193, 0.4); }
        .pkg-7 { background-color: rgba(255, 160, 122, 0.45); }
        .pkg-8 { background-color: rgba(152, 251, 152, 0.45); }
        .pkg-9 { background-color: rgba(147, 197, 253, 0.45); }
        .pkg-10 { background-color: rgba(167, 243, 208, 0.5); }

        .lesson-border {
            box-shadow: inset 0 0 0 2.5px #1d4ed8, 0 4px 12px rgba(29, 78, 216, 0.15);
            font-weight: 800;
            transform: scale(1.05);
            z-index: 10;
        }

        .day-cell {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .day-cell:hover {
            transform: scale(1.1);
            z-index: 20;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-7xl mx-auto">
        <header class="text-center mb-12 bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 text-white py-12 px-6 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(255,255,255,0.15),transparent_50%)]"></div>
            <div class="relative z-10">
                <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight mb-2">2026</h1>
                <h2 class="text-2xl sm:text-4xl font-bold tracking-tight opacity-95">Lev's Calendar</h2>
            </div>
        </header>

        <main>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12 max-w-5xl mx-auto" id="calendar-container"></div>
        </main>

        <footer class="text-center text-slate-400 text-sm mt-12 pt-6 border-t border-slate-200/80 font-medium">
            <p>© 2026 Расписание Льва. Все права защищены.</p>
        </footer>
    </div>

    <script>
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const dayNames = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
        const year = 2026;

        const pkg1 = [
            "2026-01-22","2026-01-23","2026-01-26","2026-01-27","2026-01-28","2026-01-29","2026-01-30",
            "2026-02-02","2026-02-03","2026-02-04","2026-02-05","2026-02-06",
            "2026-02-09","2026-02-10","2026-02-11","2026-02-12","2026-02-13",
            "2026-02-16","2026-02-17","2026-02-18"
        ];

        const pkg2 = [
            "2026-02-19","2026-02-20",
            "2026-02-23","2026-02-24","2026-02-25","2026-02-26","2026-02-27",
            "2026-03-02","2026-03-03","2026-03-04","2026-03-05","2026-03-06",
            "2026-03-09","2026-03-10","2026-03-11","2026-03-12","2026-03-13",
            "2026-03-16","2026-03-17","2026-03-18"
        ];

        const pkg3 = [
            "2026-03-19","2026-03-20",
            "2026-03-23","2026-03-24","2026-03-25","2026-03-26","2026-03-27",
            "2026-03-30","2026-03-31","2026-04-01","2026-04-02","2026-04-03",
            "2026-04-06","2026-04-07","2026-04-08","2026-04-09","2026-04-10",
            "2026-04-13","2026-04-14","2026-04-15"
        ];

        const pkg4 = [
            "2026-04-16","2026-04-17",
            "2026-04-20","2026-04-21","2026-04-22","2026-04-23","2026-04-24",
            "2026-04-27","2026-04-28","2026-04-29","2026-04-30",
            "2026-05-04","2026-05-05","2026-05-06","2026-05-07",
            "2026-05-25","2026-05-26","2026-05-27","2026-05-28","2026-05-29"
        ];

        const pkg5 = [
            "2026-06-01","2026-06-02","2026-06-03","2026-06-04","2026-06-05",
            "2026-06-08","2026-06-09","2026-06-10","2026-06-11","2026-06-12",
            "2026-06-15","2026-06-16","2026-06-17","2026-06-18","2026-06-19",
            "2026-06-22","2026-06-23","2026-06-24","2026-06-25","2026-06-26"
        ];

        const pkg6 = [
            "2026-06-29","2026-06-30","2026-07-01","2026-07-02","2026-07-03",
            "2026-07-06","2026-07-07","2026-07-08","2026-07-09","2026-07-10",
            "2026-07-13","2026-07-14","2026-07-15","2026-07-16","2026-07-17",
            "2026-07-20","2026-07-21","2026-07-22","2026-07-23","2026-07-24"
        ];

        const pkg7 = [
            "2026-07-27","2026-07-28","2026-07-29","2026-07-30","2026-07-31",
            "2026-08-03","2026-08-04","2026-08-05","2026-08-06","2026-08-07",
            "2026-08-10","2026-08-11","2026-08-12","2026-08-13","2026-08-14",
            "2026-08-17","2026-08-18","2026-08-19","2026-08-20","2026-08-21"
        ];

        const pkg8 = [
            "2026-08-24","2026-08-25","2026-08-26","2026-08-27","2026-08-28",
            "2026-08-31","2026-09-01","2026-09-02","2026-09-03","2026-09-04",
            "2026-09-07","2026-09-08","2026-09-09","2026-09-10","2026-09-11",
            "2026-09-14","2026-09-15","2026-09-16","2026-09-17","2026-09-18"
        ];

        const pkg9 = [
            "2026-09-21","2026-09-22","2026-09-23","2026-09-24","2026-09-25",
            "2026-09-28","2026-09-29","2026-09-30","2026-10-01","2026-10-02",
            "2026-10-05","2026-10-06","2026-10-07","2026-10-08","2026-10-09",
            "2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16"
        ];

        const pkg10 = [
            "2026-10-19","2026-10-20","2026-10-21","2026-10-22","2026-10-23",
            "2026-10-26","2026-10-27","2026-10-28","2026-10-29","2026-10-30",
            "2026-11-02","2026-11-03","2026-11-04","2026-11-05","2026-11-06",
            "2026-11-09","2026-11-10","2026-11-11","2026-11-12","2026-11-13"
        ];

        const lessons = [
            "2026-01-22","2026-01-26","2026-01-29","2026-02-02",
            "2026-02-05","2026-02-09","2026-02-12","2026-02-16",
            "2026-02-19","2026-02-23","2026-02-26","2026-03-02",
            "2026-03-05","2026-03-09","2026-03-12","2026-03-16",
            "2026-03-19","2026-03-23","2026-03-26","2026-03-30",
            "2026-04-02","2026-04-06","2026-04-09","2026-04-13",
            "2026-04-16","2026-04-20","2026-04-23","2026-04-27",
            "2026-04-30","2026-05-04","2026-05-25","2026-05-28",
            "2026-06-01","2026-06-04","2026-06-08","2026-06-11",
            "2026-06-15","2026-06-18","2026-06-22","2026-06-25",
            "2026-06-29","2026-07-02","2026-07-06","2026-07-09",
            "2026-07-13","2026-07-16","2026-07-20","2026-07-23",
            "2026-07-27","2026-07-30","2026-08-03","2026-08-06",
            "2026-08-10","2026-08-13","2026-08-17","2026-08-20",
            "2026-08-24","2026-08-27","2026-08-31","2026-09-03",
            "2026-09-07","2026-09-10","2026-09-14","2026-09-17",
            "2026-09-21","2026-09-24","2026-09-28","2026-10-01",
            "2026-10-05","2026-10-08","2026-10-12","2026-10-15",
            "2026-10-19","2026-10-22","2026-10-26","2026-10-29",
            "2026-11-02","2026-11-05","2026-11-09","2026-11-12"
        ];

        function getDaysInMonth(y,m) { return new Date(y, m+1, 0).getDate(); }
        function getFirstDayOfMonth(y,m) { const d = new Date(y,m,1).getDay(); return d===0 ? 6 : d-1; }
        function formatDate(y,m,d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
        function isInPackage(pkg, y,m,d) { return pkg.includes(formatDate(y,m,d)); }
        function isLesson(y,m,d) { return lessons.includes(formatDate(y,m,d)); }

        function createMonthCalendar(y,m) {
            const dim = getDaysInMonth(y,m);
            const off = getFirstDayOfMonth(y,m);
            const total = Math.ceil((off + dim)/7)*7;

            let html = `
                <div class="bg-white/90 backdrop-blur-md rounded-3xl shadow-lg border border-slate-200/80 overflow-hidden transition-all duration-300 hover:shadow-2xl hover:-translate-y-1">
                    <div class="bg-gradient-to-r from-slate-50 to-slate-100 text-slate-800 font-extrabold text-center py-4 text-base border-b border-slate-200/60 tracking-wide uppercase">
                        ${monthNames[m]} ${y}
                    </div>
                    <div class="p-5">
                        <table class="w-full border-collapse">
                            <thead>
                                <tr class="border-b border-slate-100">
            `;

            for (let wd of dayNames) {
                const isW = (wd === "Сб" || wd === "Вс");
                html += `<th class="py-2.5 text-xs font-bold ${isW ? 'text-red-500' : 'text-slate-400'}">${wd}</th>`;
            }
            html += `</tr></thead><tbody>`;

            let day = 1;
            for (let i = 0; i < total; i++) {
                if (i % 7 === 0) html += "<tr>";
                if (i >= off && day <= dim) {
                    const inP1 = isInPackage(pkg1, y, m, day);
                    const inP2 = isInPackage(pkg2, y, m, day);
                    const inP3 = isInPackage(pkg3, y, m, day);
                    const inP4 = isInPackage(pkg4, y, m, day);
                    const inP5 = isInPackage(pkg5, y, m, day);
                    const inP6 = isInPackage(pkg6, y, m, day);
                    const inP7 = isInPackage(pkg7, y, m, day);
                    const inP8 = isInPackage(pkg8, y, m, day);
                    const inP9 = isInPackage(pkg9, y, m, day);
                    const inP10 = isInPackage(pkg10, y, m, day);
                    const hasLesson = isLesson(y, m, day);
                    const isWeekend = (new Date(y, m, day).getDay() === 0 || new Date(y, m, day).getDay() === 6);

                    let pkgBg = "";
                    if (inP1) pkgBg = "pkg-1";
                    else if (inP2) pkgBg = "pkg-2";
                    else if (inP3) pkgBg = "pkg-3";
                    else if (inP4) pkgBg = "pkg-4";
                    else if (inP5) pkgBg = "pkg-5";
                    else if (inP6) pkgBg = "pkg-6";
                    else if (inP7) pkgBg = "pkg-7";
                    else if (inP8) pkgBg = "pkg-8";
                    else if (inP9) pkgBg = "pkg-9";
                    else if (inP10) pkgBg = "pkg-10";

                    let cls;
                    if (hasLesson) {
                        cls = pkgBg ? `lesson-border ${pkgBg} text-slate-900 rounded-xl` : "lesson-border bg-white text-blue-700 rounded-xl";
                    } else if (pkgBg) {
                        cls = `${pkgBg} font-semibold rounded-xl`;
                    } else if (isWeekend) {
                        cls = "bg-red-50/80 text-red-600 font-medium rounded-xl";
                    } else {
                        cls = "font-medium hover:bg-slate-50 rounded-xl text-slate-700";
                    }

                    html += `<td><div class="day-cell w-9 h-9 mx-auto my-1 flex items-center justify-center text-sm cursor-default ${cls}">${day}</div></td>`;
                    day++;
                } else {
                    let prevMonth = m === 0 ? 11 : m - 1;
                    let prevYear = m === 0 ? y - 1 : y;
                    let daysPrev = getDaysInMonth(prevYear, prevMonth);
                    let prevDay = daysPrev - (off - i - 1);
                    html += `<td><div class="w-9 h-9 mx-auto my-1 flex items-center justify-center rounded-xl text-sm text-slate-300 font-medium">${prevDay}</div></td>`;
                }
                if (i % 7 === 6) html += "</tr>";
            }
            html += `</tbody></table></div></div>`;
            return html;
        }

        function renderCalendar() {
            const container = document.getElementById("calendar-container");
            container.innerHTML = "";
            for (let m = 0; m < 12; m++) {
                container.innerHTML += createMonthCalendar(year, m);
            }
        }

        renderCalendar();
    </script>
</body>
</html>
